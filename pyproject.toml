[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-values"
version = "0.1.0"
description = "Storing key-value pairs in database powered by SQLAlchemy."
readme = "README.md"
keywords = ["sqlalchemy", "key-value", "database", "configuration"]
license = "MIT"
requires-python = ">=3.12"
[project.urls]
Homepage = "https://github.com/elmordo/sa-values"
Repository = "https://github.com/elmordo/sa-values"
authors = [
  { name = "Petr Jindra", email = "el.mordo@gmail.com" }
]

dependencies = [
  "sqlalchemy",
]

[project.optional-dependencies]
test = [
  "pytest",
]
dev = [
  "sa-values[test]",
  "build",
  "twine",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
