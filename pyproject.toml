[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-values"
version = "0.1.0"
description = "A SQLAlchemy-based project"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
  "sqlalchemy",
]

[project.optional-dependencies]
test = [
  "pytest",
]
dev = [
  "build",
  "twine",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
